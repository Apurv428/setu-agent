services:
  - type: web
    name: setu-agent
    runtime: python
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: SARVAM_API_KEY
        sync: false
    packages:
      - libportaudio2
